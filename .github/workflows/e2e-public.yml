# Browser tests of the public pages against a production build of the PR.
# Only specs that need no account, no fixtures and no paid API run here; they
# read public data with the anon key, so the job needs no secret.
name: E2E public pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: e2e-public-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_TELEMETRY_DISABLED: 1
      # The feature switches production turns on, so the tests check the app
      # it serves. Keep in step with the project's Vercel settings and
      # e2e-signed-in.yml.
      EXPLORE_UGC_ENABLED: "true"
      NEXT_PUBLIC_CONCIERGE_ENABLED: "true"
      NEXT_PUBLIC_EMAIL_PARSE_ENABLED: "true"
      NEXT_PUBLIC_EXPENSE_LEDGER_ENABLED: "true"
      NEXT_PUBLIC_HERO_DOODLE_ENABLED: "true"
      NEXT_PUBLIC_MAP_ROUTES_ENABLED: "true"
      NEXT_PUBLIC_MULTI_CITY_ENABLED: "true"
      NEXT_PUBLIC_TRIP_NOTIFICATIONS_ENABLED: "true"
      # No random result screen in tests: a test that wants the sky asks for it with a link.
      NEXT_PUBLIC_RESULT_SKY: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # next/font/google downloads the fonts during the build, and a dropped
      # download fails it. The build gets two more tries, a while apart and
      # without .next: a retry that reuses it fails again at once.
      - name: Build
        run: npm run build || (rm -rf .next && sleep 30 && npm run build) || (rm -rf .next && sleep 90 && npm run build)
      - name: Test the public pages
        env:
          BASE_URL: http://localhost:3000
        run: >
          npx playwright test --project=chromium
          tests/e2e/static-pages.spec.ts
          tests/e2e/pillar-pages.spec.ts
          tests/e2e/blog-sample.spec.ts
          tests/e2e/seo-and-routing.spec.ts
          tests/e2e/footer-link-integrity.spec.ts
          tests/e2e/wizard-locale-deeplink.spec.ts
          tests/e2e/wizard-restored-draft.spec.ts
          tests/e2e/wizard-generate.spec.ts
          tests/e2e/wizard-kept-plan.spec.ts
          tests/e2e/wizard-change-dates.spec.ts
          tests/e2e/wizard-assistant-undo.spec.ts
          tests/e2e/translated-page.spec.ts
          tests/e2e/backpacker-page.spec.ts
          tests/e2e/where-should-i-go.spec.ts
          tests/e2e/result-sky.spec.ts
          tests/e2e/daylight-request.spec.ts
          tests/e2e/read-request.spec.ts
          tests/e2e/tools-packing-list.spec.ts
          tests/e2e/tools-check-plan.spec.ts
          tests/e2e/mobile-webview.spec.ts
          tests/e2e/service-worker.spec.ts
          tests/e2e/consent-overlap.spec.ts
          tests/e2e/csp-policy.spec.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
